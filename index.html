<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Student Task Tracker</h1>
    
    <form id="task-form">
      <input type="text" id="task-input" placeholder="Task Title" required>
      <input type="text" id="subject-input" placeholder="Subject" required>
      <input type="date" id="due-date-input" required>
      <select id="priority-input">
        <option value="Low">Low Priority</option>
        <option value="Medium" selected>Medium Priority</option>
        <option value="High">High Priority</option>
      </select>
      <button type="submit">Add Task</button>
    </form>

    <!-- Day 3 Addition: Filter Dropdown -->
    <div class="filter-container">
      <label for="filter-priority">Filter by Priority: </label>
      <select id="filter-priority">
        <option value="All">All</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>
    </div>

    <ul id="task-list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
