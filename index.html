<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <h1>Student Task Tracker</h1>
    
    <!-- Input Section -->
    <div class="form-group">
  <input type="text" id="taskInput" placeholder="Enter a new task...">
  <input type="date" id="dateInput">
  <select id="priorityInput">
    <option value="Low">Low</option>
    <option value="Medium">Medium</option>
    <option value="High">High</option>
  </select>
  <button id="addBtn">Add Task</button>
</div>

    <!-- Filter & Action Controls -->
    <div class="filter-group">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="High">High</button>
        <button class="filter-btn" data-filter="Medium">Medium</button>
        <button class="filter-btn" data-filter="Low">Low</button>
      </div>
      <button id="clear-all-btn" class="clear-btn">Clear All Tasks</button>
    </div>

    <!-- Progress Stats Section -->
    <div class="stats-container">
      <div class="progress-info">
        <span id="progress-text">0 of 0 completed</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- Task List & Empty State -->
    <ul id="task-list"></ul>
    <p id="empty-state" class="empty-state">No tasks available. Add one above to get started!</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
