<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Student Task Tracker</h1>

    <!-- Progress Tracker -->
    <div class="stats-container">
      <div class="progress-info">
        <span>Progress</span>
        <span id="progressText">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- Input Section -->
    <div class="form-group">
      <input type="text" id="taskInput" placeholder="Enter a new task...">
      <input type="date" id="dueDateInput">
      <select id="priorityInput">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
      <button id="addBtn">Add Task</button>
    </div>

    <!-- Filter & Action Bar -->
    <div class="filter-group">
      <div class="filters">
        <button data-filter="all" class="filter-btn active">All</button>
        <button data-filter="pending" class="filter-btn">Pending</button>
        <button data-filter="completed" class="filter-btn">Completed</button>
      </div>
      <button id="clearAllBtn" class="clear-btn">Clear All</button>
    </div>

    <!-- Task List -->
    <ul id="taskList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
